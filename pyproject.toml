[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.17,<0.12" ]

[project]
name = "oryx"
version = "0.1.0"
description = ""
authors = [ { name = "Robert Hofer", email = "1058012+hofrob@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cyclopts",
  "pyyaml",
  "requests",
  "rich",
]
scripts.oryx = "oryx.main:run"

[dependency-groups]
dev = [
  "mdformat",
  "pre-commit",
  "pyproject-fmt",
  "ruff",
  "ty",
]
